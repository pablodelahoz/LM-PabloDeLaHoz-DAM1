<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Validación de usuario</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <form method="post">
   <label for="usuario">Usuario</label>
        <input type="text" name="usuario" placeholder="(10 caracteres)" maxlength="20" size="20" /> <br>
        <label for="password">Contraseña</label> 
        <input type="password" name="password" maxlength="20" size="20" /> <br>
        <input type="submit" value="Enviar" />
        <input type="reset" value="Borrar" /> <br>
        <label for="observaciones">Observaciones</label> 
        <textarea name="observaciones" rows="5" cols="40"></textarea>
    </form>
</body>
</html>
